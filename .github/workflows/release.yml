# Builds the portable Windows zip and the web zip and attaches them to a GitHub Release.
# Start it from the Actions tab ("Run workflow"): it tags v<version from package.json>.
# Pushing a tag such as v0.7.0 works too.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package portable app
        run: npm run package:win
      - name: Slim and zip
        id: zip
        shell: pwsh
        run: |
          $app = "dist/TextForge-win32-x64/resources/app"
          Get-ChildItem "$app/node_modules" | Where-Object { $_.Name -ne 'monaco-editor' } | Remove-Item -Recurse -Force
          Copy-Item packaging/README.txt dist/TextForge-win32-x64/README.txt
          Copy-Item LICENSE dist/TextForge-win32-x64/LICENSE.txt
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path dist/TextForge-win32-x64 -DestinationPath "dist/TextForge-$v-win-x64-portable.zip"
          node build-web.js
          Copy-Item packaging/README.txt web-dist/selfhost/README.txt
          Compress-Archive -Path web-dist/selfhost -DestinationPath "dist/TextForge-$v-web.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.zip.outputs.version) }}
          name: TextForge ${{ steps.zip.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/TextForge-*-win-x64-portable.zip
            dist/TextForge-*-web.zip
          generate_release_notes: true
